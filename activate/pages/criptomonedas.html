<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Activate: Criptomonedas</title>
  <link rel="icon" href="../../media/Logo_Windows.png" />
  <style>
    :root{
      --bg-1:#080c1f;
      --bg-2:#050915;
      --bg-3:#04060f;
      --text:#cfd6ff;
      --accent:#72f5ff;
      --card-top:#0a0f44;
      --card-mid:#050a1f;
      --card-bottom:#030712;
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      min-height:100%;
    }

    body{
      font-family:"Segoe UI", Inter, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 500px at 50% -20%, #1b1f4f55, transparent 60%),
        linear-gradient(var(--bg-1),var(--bg-2) 65%,var(--bg-3));
      display:flex;
      justify-content:center;
      align-items:center;
      padding:28px 18px 72px; /* espacio extra para texto de marca abajo */
      position:relative;
    }

    .app{
      width:min(1100px, 100%);
      text-align:center;
    }

    h1{
      margin:0 0 22px;
      font-weight:700;
      letter-spacing:.02em;
      color:#ddf7ff;
      font-size:clamp(1.2rem, 2.6vw, 2rem);
      text-shadow:0 0 6px #9ff7ff90, 0 0 14px #79dbff60;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:18px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      text-decoration:none;
      border:none;
      border-radius:24px;
      min-height:155px;
      padding:14px;
      font-size:clamp(1rem, 1.5vw, 1.15rem);
      font-weight:800;
      line-height:1.25;
      color:var(--accent);
      background:linear-gradient(180deg,var(--card-top) 0%, var(--card-mid) 72%, var(--card-bottom) 100%);
      box-shadow:
        inset 0 0 0 2px #cfd1ff44,
        0 0 24px #cfd3ff47,
        0 0 3px #ffffff45;
      text-shadow:0 0 10px #6ff8ff, 0 0 20px #56dfff66;
      transition:transform .2s ease, box-shadow .2s ease, filter .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover,
    .btn:focus-visible{
      transform:translateY(-2px);
      box-shadow:
        inset 0 0 0 2px #dff2ff77,
        0 0 30px #cdd7ff70,
        0 0 10px #85ffff66;
      filter:brightness(1.05);
      outline:none;
    }

    .btn_back{
      background:transparent;
      color:lightblue;
      border:none;
      font-size:1rem;
      position:fixed;
      left:12px;
      top:12px;
      z-index:20;
      padding:8px 10px;
      border-radius:10px;
    }

    .btn_back:hover{ cursor:pointer; }

    .brand_text{
      text-decoration:none;
      color:#ffffff;
      position:fixed;                  /* fijo en pantalla */
      left:12px;
      bottom:max(10px, env(safe-area-inset-bottom));
      z-index:20;
      font-size:.92rem;
      opacity:.95;
    }

    @media (max-width: 900px){
      .grid{ grid-template-columns:repeat(2, minmax(0, 1fr)); }
      .btn{ min-height:140px; }
    }

    @media (max-width: 560px){
      body{
        align-items:flex-start;
        padding:72px 12px 84px;
      }

      .grid{
        grid-template-columns:1fr;
        gap:14px;
      }

      .btn{
        min-height:112px;
        border-radius:18px;
        font-size:1rem;
      }

      h1{
        margin-bottom:16px;
        font-size:1.2rem;
      }

      .btn_back{
        left:8px;
        top:8px;
        font-size:.95rem;
      }

      .brand_text{
        left:10px;
        font-size:.85rem;
      }
    }
  </style>
</head>
<body>
  <button class="btn_back" onclick="window.location.href='../main.html';">Volver</button>
  <a href="../main.html" class="brand_text">Kryptobyte - Activate</a>

  <main class="app">
    <h1>Criptomonedas y Blockchain</h1>

    <section class="grid">
      <a class="btn" href="criptomonedas/criptomonedas0.html">El Dinero y Las Bases</a>
      <a class="btn" href="criptomonedas/criptomonedas2.html">Infraestructura y primeros pasitos</a>
      <a class="btn" href="criptomonedas/criptomonedas5.html">Bitcoin</a>
      <a class="btn" href="criptomonedas/criptomonedas8.html">Ethereum</a>
      <a class="btn" href="criptomonedas/criptomonedas13.html">Expandiendo el ecosistema</a>
      <a class="btn" href="cripto_wait.html">Seguridad, privacidad y el futuro</a>
    </section>
  </main>
</body>
</html>
